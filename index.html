<title>なすびのお庭</title>
<meta name="description" content="なすびのお庭は、ブラウザですぐ遊べる小さなゲームをつくっている場所です。スマホでもPCでも、インストールなしで遊べます。">
<meta name="theme-color" content="#fbf6ec">
<meta property="og:title" content="なすびのお庭">
<meta property="og:description" content="ブラウザですぐ遊べる小さなゲームの庭。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #fbf6ec;
  --bg2: #f3ead8;
  --card: #ffffff;
  --ink: #3a2d4a;
  --muted: #7c6f86;
  --purple: #6b3fa0;
  --purple2: #8e5cc9;
  --leaf: #4f9a5a;
  --leaf2: #7cc47f;
  --soil: #b98b62;
  --line: rgba(58, 45, 74, 0.1);
  --shadow: 0 10px 30px rgba(74, 48, 104, 0.12);
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1626; --bg2: #241c31; --card: #2c2339; --ink: #f4eefb; --muted: #b8a9c9;
    --purple: #b58cf0; --purple2: #cfaefb; --leaf: #7cc47f; --leaf2: #a5e0a6; --soil: #d7ae86;
    --line: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #1c1626; --bg2: #241c31; --card: #2c2339; --ink: #f4eefb; --muted: #b8a9c9;
  --purple: #b58cf0; --purple2: #cfaefb; --leaf: #7cc47f; --leaf2: #a5e0a6; --soil: #d7ae86;
  --line: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  line-height: 1.7; -webkit-text-size-adjust: 100%;
}
a { color: inherit; }
.wrap { width: min(1040px, 100% - 32px); margin: 0 auto; }

/* ---------- ヘッダー ---------- */
header.top {
  position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 900; font-size: 18px; }
.brand svg { width: 34px; height: 34px; }
nav a { text-decoration: none; font-weight: 800; font-size: 14px; color: var(--muted); margin-left: 18px; }
nav a:hover { color: var(--purple); }

/* ---------- はじめ（小さめ） ---------- */
.hero { padding: 28px 0 8px; }
.hero .wrap { display: flex; align-items: center; gap: 18px; }
.hero .mascot { width: 92px; flex-shrink: 0; animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.hero h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); line-height: 1.2; font-weight: 900; }
.hero h1 .n { color: var(--purple); } .hero h1 .g { color: var(--leaf); }
.hero p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 900; font-size: 16px;
  padding: 13px 26px; border-radius: 999px; color: #fff; border: 0; cursor: pointer; font-family: inherit;
  background: linear-gradient(180deg, var(--purple2), var(--purple));
  box-shadow: 0 5px 0 color-mix(in srgb, var(--purple) 70%, black), 0 12px 24px rgba(107, 63, 160, 0.3);
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--purple) 70%, black); }
.btn.ghost { background: var(--bg2); color: var(--ink); box-shadow: none; }

/* ---------- 見出し ---------- */
section { padding: 28px 0; }
.sec-title { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
.sec-title h2 { margin: 0; font-size: 22px; font-weight: 900; }
.sec-title span { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: .12em; }

/* ---------- 新作（大きく1つ） ---------- */
.feature {
  display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 22px 26px; border-radius: 26px;
  background: radial-gradient(circle at 15% 30%, #4b33a8, #1d1546 70%); color: #fff; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden;
}
.feature img { width: 132px; aspect-ratio: 1; border-radius: 24%; box-shadow: 0 14px 30px rgba(0,0,0,.45); }
.feature .new { display: inline-block; font-size: 12px; font-weight: 900; padding: 3px 12px; border-radius: 999px; background: #ffe45e; color: #4a3700; letter-spacing: .08em; }
.feature h3 { margin: 6px 0 2px; font-size: clamp(24px, 4vw, 32px); font-weight: 900; line-height: 1.2; }
.feature p { margin: 0 0 14px; font-size: 14px; opacity: .88; }
.feature .row { display: flex; gap: 10px; flex-wrap: wrap; }
.feature .btn.ghost { background: rgba(255,255,255,.14); color: #fff; }

/* ---------- ゲーム（アイコン一覧） ---------- */
#games { padding-top: 8px; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 24px 16px; }
.live { background: var(--card); border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); }
.live-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live-head b { font-size: 18px; font-weight: 900; }
.prime { font-size: 12.5px; font-weight: 800; padding: 3px 12px; border-radius: 999px; background: var(--bg2); color: var(--muted); }
.prime.hot { background: #ffcf3a; color: #3a2a00; animation: primeglow 1.6s infinite; }
@keyframes primeglow { 50% { box-shadow: 0 0 0 5px rgba(255, 207, 58, .35); } }
.live-sum { margin: 8px 0 10px; font-size: 14px; font-weight: 800; }
.live-sum b { font-size: 18px; }
.live-list { display: flex; flex-wrap: wrap; gap: 8px; }
.live-list a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--bg2); color: inherit; text-decoration: none; font-size: 13px; font-weight: 800; }
.live-list a img { width: 26px; height: 26px; border-radius: 8px; }
.live-list a em { font-style: normal; font-size: 12px; color: var(--muted); }
.live-list a.on { background: #e9f8ee; color: #1f6b3a; }
.live-list a.on em { color: #1f6b3a; }
.live-note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.app .ic .wait { position: absolute; left: 6px; bottom: 6px; padding: 2px 8px; border-radius: 999px; background: #2fbf6b; color: #fff; font-size: 11px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.sh-live { margin: 6px 0 0; font-size: 13px; font-weight: 800; color: #1f6b3a; min-height: 0; }
.sh-live:empty { display: none; }
.app { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-family: inherit; }
.app .ic { width: 100%; max-width: 120px; aspect-ratio: 1; border-radius: 24%; overflow: hidden; position: relative; box-shadow: 0 8px 18px rgba(58, 45, 74, .18); transition: transform .15s; background: var(--card); }
.app:hover .ic { transform: translateY(-3px) scale(1.03); } .app:active .ic { transform: scale(.95); }
.app .ic img { width: 100%; height: 100%; display: block; }
.app .ic .dot { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: #ff5a5a; border: 2px solid #fff; }
.app b { font-size: 13px; font-weight: 800; line-height: 1.3; text-align: center; }
.app.soon .ic { display: grid; place-items: center; font-size: 40px; box-shadow: none; border: 2px dashed var(--line); background: repeating-linear-gradient(45deg, var(--bg2), var(--bg2) 10px, var(--bg) 10px, var(--bg) 20px); }
.app.soon b { color: var(--muted); }

/* ---------- くわしく（下から出る） ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(20, 12, 30, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
.sheet { visibility: hidden; position: fixed; left: 50%; bottom: 0; width: min(520px, 100%); transform: translate(-50%, 105%); background: var(--card); border-radius: 26px 26px 0 0; padding: 14px 22px calc(26px + env(safe-area-inset-bottom, 0px)); z-index: 31; transition: transform .25s cubic-bezier(.2,.9,.3,1.1), visibility 0s .25s; box-shadow: 0 -10px 40px rgba(0,0,0,.25); max-height: 88vh; overflow: auto; }
.sheet-on .sheet-bg { opacity: 1; pointer-events: auto; } .sheet-on .sheet { transform: translate(-50%, 0); visibility: visible; transition: transform .25s cubic-bezier(.2,.9,.3,1.1); }
.sheet .grip { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
.sheet .head { display: flex; gap: 16px; align-items: center; }
.sheet .head img { width: 96px; aspect-ratio: 1; border-radius: 24%; box-shadow: 0 8px 18px rgba(0,0,0,.2); }
.sheet h3 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.25; }
.sheet .yomi { font-size: 12px; color: var(--muted); font-weight: 800; }
.sheet p { margin: 14px 0; font-size: 15px; }
.sheet .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.sheet .tags span { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--bg2); color: var(--muted); }
.sheet .btn { width: 100%; font-size: 18px; padding: 15px; }
.sheet .close { position: absolute; top: 12px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg2); color: var(--ink); font-size: 18px; cursor: pointer; }

/* ---------- お知らせ ---------- */
.news { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.news li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 16px 4px; border-bottom: 1px solid var(--line); }
.news time { font-size: 14px; font-weight: 800; color: var(--purple); font-variant-numeric: tabular-nums; }
.news p { margin: 0; font-size: 15px; }
.news li.more { display: none; } .news.open li.more { display: grid; }
.news-more { margin: 14px auto 0; display: block; }

/* ---------- このお庭について ---------- */
.about { display: grid; grid-template-columns: 120px 1fr; gap: 24px; align-items: center; background: var(--card); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.about svg { width: 120px; }
.about p { margin: 0 0 8px; }
.about p:last-child { margin: 0; color: var(--muted); font-size: 14px; }

footer { padding: 36px 0 48px; text-align: center; font-size: 13px; color: var(--muted); }

/* ---------- ことばの切りかえ ---------- */
.hero .wrap { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "m t" "m l"; column-gap: 18px; }
.hero .mascot { grid-area: m; } .hero .wrap > div:not(.langs) { grid-area: t; align-self: end; }
.langs { grid-area: l; align-self: start; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.langs button { font: 800 12.5px var(--font); line-height: 1.4; background: transparent; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.langs button:hover { color: var(--purple); border-color: var(--purple); }
.langs button[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
/* 中国語は台湾の丸ゴシック、韓国語は見出しだけ丸い字（Jua）。日本語のフォントに無い字のため */
html[data-lang="zh"] { --font: "Chiron GoRound TC", "M PLUS Rounded 1c", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
html[data-lang="ko"] { --font: "M PLUS Rounded 1c", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
html[data-lang="ko"] :is(.brand, .hero h1, .sec-title h2, .feature h3, .sheet h3, .live-head b, .btn, .app b) { font-family: "M PLUS Rounded 1c", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-synthesis: none; }
html[data-lang="en"] .sec-title span { display: none; }
.brand { white-space: nowrap; }
@media (max-width: 720px) {
  .hero .wrap { grid-template-areas: "m t" "l l"; column-gap: 14px; }
  .langs { margin-top: 12px; }
}
@media (max-width: 380px) {
  .brand { font-size: 16px; gap: 8px; } .brand svg { width: 30px; height: 30px; }
  html[data-lang="en"] .hero h1 { font-size: 23px; }
}

@media (max-width: 720px) {
  .hero { padding: 18px 0 4px; } .hero .mascot { width: 64px; } .hero p { font-size: 13px; }
  .feature { grid-template-columns: 1fr; text-align: center; padding: 22px 18px; gap: 12px; justify-items: center; }
  .feature img { width: 120px; } .feature .row { justify-content: center; }
  .apps { grid-template-columns: repeat(3, 1fr); gap: 18px 12px; }
  nav a { margin-left: 12px; font-size: 13px; }
  .news li { grid-template-columns: 1fr; gap: 2px; padding: 12px 4px; }
  .about { grid-template-columns: 1fr; text-align: center; }
  .about svg { margin: 0 auto; width: 96px; }
}
@media (max-width: 380px) { nav a:first-child { display: none; } }
@media (prefers-reduced-motion: reduce) { .mascot { animation: none; } html { scroll-behavior: auto; } .sheet, .sheet-bg { transition: none; } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><svg aria-hidden="true"><use href="#nasubi"/></svg><span data-i="doc_title">なすびのお庭</span></a>
    <nav><a href="#games" data-i="nav_games">ゲーム</a><a href="#news" data-i="nav_news">お知らせ</a><a href="#about" data-i="nav_about">このお庭</a></nav>
  </div>

<main>
  <div class="hero">
    <div class="wrap">
      <svg class="mascot" viewBox="0 0 200 240" role="img" aria-label="なすびのキャラクター" data-ia="mascot"><use href="#nasubi"/></svg>
      <div>
        <h1 data-ih="hero_h1"><span class="n">なすび</span>の<span class="g">お庭</span></h1>

<script>
// =============================================
//  ゲームとお知らせの一覧
//  新しいゲームやお知らせは、ここに1つ足すだけで表示されます
//  en / zh / ko は英語・中国語（繁体字）・韓国語の文。なければ日本語のまま出ます
//  ことばのボタンや見出しの訳は js/i18n.js
// =============================================
const GAMES = [
  {
    name: 'さかさまドロップ', qm: 'sakasama',
    url: 'https://nasubi-no-oniwa.github.io/sakasama/',
    image: 'img/sakasama-drop.png',
    text: '4つつなげて消す落ちものパズル。ゲージが溜まったら、相手の盤面をさかさまに！ 積み上げた連鎖がひっくり返る、荒れる対戦パズル。',
    tags: ['パズル', 'CPU対戦', 'だれかと対戦', '合言葉で対戦', '観戦'],
    en: {"name": "Upside-Down Drop", "text": "A falling-block puzzle: connect 4 to clear. When your gauge fills, flip your opponent's board upside down! Their stacked-up chains get turned over in this wild battle puzzle."},
    zh: {"name": "顛倒掉落", "text": "連成4個就消除的掉落式益智遊戲。量表集滿後，把對手的盤面上下顛倒！辛苦堆好的連鎖瞬間翻轉，混亂的對戰益智遊戲。"},
    ko: {"name": "거꾸로 드롭", "text": "4개를 이으면 사라지는 낙하 퍼즐. 게이지가 차면 상대의 판을 거꾸로 뒤집어라! 쌓아 둔 연쇄가 뒤집히는 난장판 대전 퍼즐."},
  },
  {
    name: '4つ目のダルマ', qm: 'daruma',

const NEWS = [
  { date: '2026.10.30', text: '新作「魔法の球 卓球」を公開しました。魔法の球の卓球版で、線を描いた魔球サーブを、スワイプで打ち返します。回転は打つまで分からない。野球・PK・卓球はタイトルのタブで行き来できます。', en: "New game \"Magic Pitch Ping-Pong\" is out. The ping-pong version of Magic Pitch: draw a magic serve and swipe to return it. You won't know the spin until you swing. Switch between Baseball, PK and Ping-Pong with the tabs on the title screen.", zh: "推出新作「魔法之球 桌球」。魔法之球的桌球版，畫出魔球發球，用滑動回擊。旋轉要到揮拍時才知道。棒球・PK・桌球可以用標題畫面的分頁切換。", ko: "신작 「마법의 공 탁구」를 공개했어요. 마법의 공의 탁구판으로, 선을 그린 마구 서브를 스와이프로 받아쳐요. 회전은 칠 때까지 몰라요. 야구・PK・탁구는 타이틀의 탭으로 오갈 수 있어요." },
  { date: '2026.10.30', text: '新作「魔法の球 PK」を公開しました。魔法の球のサッカー版で、線を描いた魔球をキーパーが止めます。合言葉でけり合って、止められていない魔球のランキングを目指しましょう。', en: "New game \"Magic Pitch PK\" is out. The soccer version of Magic Pitch: draw a magic shot and let keepers try to stop it. Trade shots with a code and aim for the most unstoppable shot.", zh: "推出新作「魔法之球 PK」。魔法之球的足球版，畫出的魔球由守門員來擋。用暗號互相踢，挑戰「沒被擋下的魔球」排行榜吧。", ko: "신작 「마법의 공 PK」를 공개했어요. 마법의 공의 축구판으로, 선을 그린 마구를 골키퍼가 막아요. 암호로 서로 차며 막히지 않은 마구 랭킹을 노려 보세요." },
  { date: '2026.10.29', text: '新作「とんで、こんにゃく」を公開しました。おでんの鍋から逃げたこんにゃくを、フライ返しで弾いて変なところに乗せるゲームです。全30面、面ごとのクリア時間ランキングつき。', en: "New game \"Flying Konnyaku\" is out. Flip a konnyaku that escaped the oden pot and land it on weird things. 30 stages, with a clear-time ranking for every stage.", zh: "推出新作「飛吧，蒟蒻」。用鍋鏟把從關東煮鍋裡逃出來的蒟蒻彈到奇怪的地方。共30關，每關都有通關時間排行榜。", ko: "신작 「날아라, 곤약」을 공개했어요. 오뎅 냄비에서 도망친 곤약을 뒤집개로 튕겨 이상한 곳에 올리는 게임이에요. 모두 30스테이지, 스테이지마다 클리어 시간 랭킹이 있어요." },
  { date: '2026.10.29', text: '新作「魔法の球」を公開しました。ストライクゾーンまで線を描くと、それが魔球になります。合言葉で魔球を投げ合って、打たれていない魔球のランキングを目指しましょう。', en: "New game \"Magic Pitch\" is out. Draw a line to the strike zone and it becomes your magic pitch. Trade pitches with a code and aim for the ranking of the most unhittable pitches.", zh: "推出新作「魔法之球」。畫一條線到好球帶，它就變成魔球。用暗號互相投魔球，挑戰「沒被打到的魔球」排行榜吧。", ko: "신작 「마법의 공」을 공개했어요. 스트라이크 존까지 선을 그리면 그것이 마구가 돼요. 암호로 마구를 주고받으며, 맞지 않은 마구 랭킹을 노려 보세요." },
  { date: '2026.10.29', text: '新作を2本公開しました。もやしを丼に盛って運ぶ「もやしの次郎」と、どう投げても帰ってくる手りゅう弾から生きのびる「手りゅう弾は帰宅する」。どちらもランキングつきです。', en: "Two new games are out: \"Moyashi no Jiro\", where you pile bean sprouts on a bowl and carry it, and \"The Grenade Comes Home\", where you survive a grenade that comes back however you throw it. Both have rankings.", zh: "推出2款新作：把豆芽堆到碗上端出去的「豆芽次郎」，以及不管怎麼丟都會回來、要從手榴彈下活下來的「手榴彈回家了」。兩款都有排行榜。", ko: "신작 2개를 공개했어요. 숙주를 그릇에 쌓아 나르는 「숙주의 지로」와, 어떻게 던져도 돌아오는 수류탄에서 살아남는 「수류탄은 귀가한다」. 둘 다 랭킹이 있어요." },
  { date: '2026.10.27', text: '「風呂屋の女」は3Dになって「穴の神隠し」に生まれ変わりました。巨大なお尻から出てくる○△■を引っぱり出して、1万通りの称号を集めましょう。ランキングも新しくなりました。', en: "\"Furoya no Onna\" has been reborn in 3D as \"Ana no Kamikakushi\". Pull the ○△■ out of a giant butt and collect 10,000 titles. The rankings are new, too.", zh: "「風呂屋の女」變成3D，重生為「穴の神隠し」。把巨大屁股裡出來的○△■拉出來，收集1萬種稱號吧。排行榜也更新了。", ko: "「風呂屋の女」가 3D가 되어 「穴の神隠し」로 다시 태어났어요. 거대한 엉덩이에서 나오는 ○△■를 끌어내 1만 가지 칭호를 모아 보세요. 랭킹도 새로워졌어요." },
  { date: '2026.10.27', text: '新作「風呂屋の女」（いまの「穴の神隠し」）を公開しました。くさい客にからまったガラクタを、綱で引っぱり出す力加減のゲームです。女将の声をたよりに、大きいガラクタを出しつづけましょう。ランキングつき。', en: "New game \"Furoya no Onna\" (now \"Ana no Kamikakushi\") is out. A game of finesse where you pull junk tangled on a smelly customer out with a rope. Follow the landlady's voice and keep pulling out big junk. With rankings.", zh: "推出新作「風呂屋の女」（現在的「穴の神隠し」）。用繩子把纏在臭客人身上的破爛拉出來、考驗力道的遊戲。跟著老闆娘的聲音，不斷拉出大件破爛吧。附排行榜。", ko: "신작 「風呂屋の女」(지금의 「穴の神隠し」)를 공개했어요. 냄새나는 손님에게 엉킨 잡동사니를 밧줄로 끌어내는 힘 조절 게임이에요. 여주인의 목소리를 따라 큰 잡동사니를 계속 끌어내세요. 랭킹 있음." },
  { date: '2026.10.27', text: '新作「インテグラ・レイヤー」を公開しました。倒れた誰かの欠片を盤面につないで強くなる、全員参加型のローグライクです。ボスの予告、地域の大ボス、合成所つき。みんなで100階の塔を上りましょう。', en: "New game \"Integra Layer\" is out. A roguelike everyone plays together, where you get stronger by linking the shards of the fallen on your board. With boss previews, regional big bosses, and a fusion shop. Let's climb the 100-floor tower together.", zh: "推出新作「整合層」。把倒下之人的碎片接在盤面上變強、全員參與的Roguelike。有頭目預告、地區大頭目、合成所。大家一起登上100層的塔吧。", ko: "신작 「인테그라 레이어」를 공개했어요. 쓰러진 누군가의 조각을 판에 이어 강해지는, 모두가 참여하는 로그라이크예요. 보스 예고, 지역 대보스, 합성소도 있어요. 다 함께 100층 탑을 올라요." },
  { date: '2026.10.23', text: "新作「Fairies' Tower（フェアリーズタワー）」を公開しました。妖精になって、倒れた仲間の屍を足場に100層の世界樹を昇ります。3つの陣営に分かれて頂上を目指す競争。掲示板つき、4つの言葉で遊べます。", en: "New game \"Fairies' Tower\" is out. Become a fairy and climb the 100-floor World Tree, using fallen allies' remains as footholds. Split into 3 factions and race to the top. With message boards, playable in 4 languages.", zh: "推出新作「Fairies' Tower」。化身妖精，以倒下同伴的屍骸為踏腳石，攀登100層的世界樹。分成3個陣營比賽誰先登頂。附留言板，可用4種語言遊玩。", ko: "신작 「Fairies' Tower」를 공개했어요. 요정이 되어 쓰러진 동료의 시체를 발판 삼아 100층의 세계수를 올라요. 3개 진영으로 나뉘어 정상을 향해 경쟁. 게시판이 있고, 4개 언어로 즐길 수 있어요." },
  { date: '2026.10.23', text: '新作「芋娘」を公開しました。教官の目を盗んで芋を食べる、2ボタンの3Dゲームです。コンボ・芋祭り・階級・ランキングつき。60秒で何個食べられるか、めざせ芋将軍！', en: "New game \"Sweet Potato Girl\" is out. A 2-button 3D game where you eat sweet potatoes behind the instructor's back. With combos, Potato Festivals, ranks and rankings. How many can you eat in 60 seconds? Aim for Potato General!", zh: "推出新作「地瓜娘」。躲過教官的眼睛吃地瓜、只用2個按鈕的3D遊戲。有連擊、地瓜祭、階級、排行榜。60秒能吃幾個？目標是地瓜將軍！", ko: "신작 「고구마 소녀」를 공개했어요. 교관 몰래 고구마를 먹는 2버튼 3D 게임이에요. 콤보, 고구마 축제, 계급, 랭킹 있음. 60초에 몇 개 먹을 수 있을까, 목표는 고구마 장군!" },
  { date: '2026.10.20', text: '新作「シインクラッド」を公開しました。死ぬとそこが足場になる、みんなで挑む全100層の横スクロールです。屍はすべての人で共有、だれかが越えると次の層が開きます。', en: "New game \"Shiincrad\" is out. A 100-layer side-scroller everyone takes on together, where the spot you die becomes a foothold. Corpses are shared by all players, and when someone gets past, the next layer opens.", zh: "推出新作「Shiincrad」。死掉的地方會變成踏腳處、大家一起挑戰的全100層橫向卷軸遊戲。屍體由所有人共享，有人越過後下一層就會開放。", ko: "신작 「시인크래드」를 공개했어요. 죽은 곳이 발판이 되는, 모두가 함께 도전하는 전 100층 횡스크롤이에요. 시체는 모든 사람이 공유하고, 누군가 넘으면 다음 층이 열려요." },
  { date: '2026.10.18', text: '新作「弾丸合併」を公開しました。市町村や国を3つ串ざしにしてコマを作る、全自動の3Dバトルです。だれかと対戦・挑戦状・番付つき。', en: "New game \"Bullet Merger\" is out. A fully automatic 3D battle where you skewer 3 municipalities or countries to make a top. With online matchmaking, challenges and rankings.", zh: "推出新作「子彈合併」。把3個市町村或國家串起來做成陀螺的全自動3D對戰。有隨機對戰、挑戰書、排行。", ko: "신작 「탄환 합병」을 공개했어요. 시정촌이나 나라 3개를 꿰어 팽이를 만드는 전자동 3D 배틀이에요. 아무나와 대전, 도전장, 순위표 있음." },
  { date: '2026.10.16', text: '新作「自分」を公開しました。名前と誕生日と生まれた市町村区から、あなたの前世の一生を年表で出します。縄文から昭和まで、その土地で本当にあったできごとも。', en: "New game \"Myself\" is out. From your name, birthday and birthplace, it shows your past life as a timeline. From Jomon to Showa, including events that really happened in that place.", zh: "推出新作「自己」。從名字、生日和出生的市町村區，以年表呈現你前世的一生。從繩文到昭和，還有那片土地上真實發生過的事。", ko: "신작 「나」를 공개했어요. 이름과 생일, 태어난 시정촌구로 당신 전생의 일생을 연표로 보여 줘요. 조몬부터 쇼와까지, 그 땅에서 실제로 있었던 일도." },
  { date: '2026.10.16', text: '「地元の最強」に世界の国・州・都市・町が参戦しました。ソ連やユーゴスラビアなどの昔の国も。全24,838が出場できます。', en: "Countries, states, cities and towns from around the world have joined \"Hometown Champion\". Even former countries like the USSR and Yugoslavia. 24,838 entrants in all.", zh: "世界各國・州・城市・城鎮加入了「家鄉最強」。連蘇聯、南斯拉夫等過去的國家也在。共24,838個可以出場。", ko: "「우리 동네 최강」에 세계의 나라·주·도시·마을이 참전했어요. 소련이나 유고슬라비아 같은 옛 나라도. 총 24,838곳이 출전할 수 있어요." },
  { date: '2026.10.15', text: '「だれかと対戦」を7つのゲームに追加しました。待っている人と自動でつながります。毎晩21時〜22時は対戦タイム！ 地元の最強には、いつでも戦える「挑戦状」も。', en: "Added \"Play someone online\" to 7 games. You'll be matched automatically with someone who's waiting. Every night 21:00–22:00 JST is Battle Time! Hometown Champion also has \"Challenges\" you can fight anytime.", zh: "在7款遊戲中加入了「隨機對戰」。會自動和正在等待的人配對。每晚日本時間21〜22點是對戰時間！家鄉最強還有隨時都能戰鬥的「挑戰書」。", ko: "7개 게임에 「아무나와 대전」을 추가했어요. 기다리는 사람과 자동으로 연결돼요. 매일 밤 일본 시간 21~22시는 대전 타임! 우리 동네 최강에는 언제든 싸울 수 있는 「도전장」도." },
  { date: '2026.10.15', text: '新作「地元の最強」を公開しました。全国の市町村の本物の形でぶつかり合う、全自動の対戦ゲームです。明治から今までの、なくなった町村も出場できます。', en: "New game \"Hometown Champion\" is out. A fully automatic battle game where the real shapes of Japan's municipalities clash. Towns and villages from the Meiji era on, even ones that no longer exist, can enter.", zh: "推出新作「家鄉最強」。用全日本市町村真實形狀互相碰撞的全自動對戰遊戲。從明治到現在、已經消失的町村也能出場。", ko: "신작 「우리 동네 최강」을 공개했어요. 일본 전국 시정촌의 실제 모양으로 부딪치는 전자동 대전 게임이에요. 메이지 시대부터 지금까지, 사라진 마을도 출전할 수 있어요." },
  { date: '2026.10.14', text: '新作「ピンチボウル」を公開しました。ボウリングのピンになって球をよける、1対1の3Dアクションです。ガードレールではね返る球に、ドミノのように倒れるピン。', en: "New game \"Pinch Bowl\" is out. A 1-on-1 3D action game where you become a bowling pin and dodge the ball. Balls that bounce off the guardrails, and pins that fall like dominoes.", zh: "推出新作「閃避保齡球」。變成保齡球瓶閃避球的一對一3D動作遊戲。會被護欄反彈的球，和像骨牌一樣倒下的球瓶。", ko: "신작 「핀치 볼」을 공개했어요. 볼링 핀이 되어 공을 피하는 1대1 3D 액션이에요. 가드레일에 튕기는 공과 도미노처럼 쓰러지는 핀." },
  { date: '2026.10.14', text: '新作「ユキダマッチ」を公開しました。雪合戦の1対1で戦う3Dアクションです。かべが溶けていく3つのステージ、4つの特技、決着リプレイつき。', en: "New game \"Snowball Match\" is out. A 1-on-1 snowball fight in 3D action. 3 stages where the walls melt away, 4 special skills, and finishing-blow replays.", zh: "推出新作「雪球對決」。一對一打雪仗的3D動作遊戲。牆會融化的3個關卡、4種特技、決勝重播。", ko: "신작 「눈싸움 매치」를 공개했어요. 1대1 눈싸움 3D 액션이에요. 벽이 녹아 가는 3개 스테이지, 4가지 특기, 결착 리플레이 있음." },
  { date: '2026.10.11', text: '新作「バトベイ」を公開しました。描いたコマで戦う3Dバトルごまです。60秒で描いて戦う、らくがきバトルも。', en: "New game \"Batbey\" is out. 3D battle tops where you fight with a top you drew. There's also Doodle Battle: draw in 60 seconds, then fight.", zh: "推出新作「對戰陀螺」。用自己畫的陀螺戰鬥的3D戰鬥陀螺。也有60秒畫完就開打的塗鴉對戰。", ko: "신작 「배트베이」를 공개했어요. 직접 그린 팽이로 싸우는 3D 배틀 팽이예요. 60초 안에 그리고 싸우는 낙서 배틀도." },
  { date: '2026.10.09', text: '新作「絵私（えし）」を公開しました。自分で描いたキャラに骨を入れて戦う、お絵かき格闘ゲームです。キャラID・みんなのキャラ・らくがきバトル・観戦つき。', en: "New game \"Eshi\" is out. A drawing fighting game where you put bones into a character you drew and fight. With character IDs, everyone's characters, Doodle Battle and spectating.", zh: "推出新作「繪我（Eshi）」。替自己畫的角色裝上骨頭來戰鬥的塗鴉格鬥遊戲。有角色ID、大家的角色、塗鴉對戰、觀戰。", ko: "신작 「에시」를 공개했어요. 직접 그린 캐릭터에 뼈를 넣어 싸우는 그림 격투 게임이에요. 캐릭터 ID, 모두의 캐릭터, 낙서 배틀, 관전 있음." },
  { date: '2026.10.09', text: '「さくがえ」に、あいことば対戦と観戦を追加しました。', en: "Added passcode matches and spectating to \"Fence Swap\".", zh: "「柵欄互換」加入了暗號對戰和觀戰。", ko: "「울타리 체인지」에 암호 대전과 관전을 추가했어요." },
  { date: '2026.10.08', text: '新作「回廊快走（かいろうかいそう）」を公開しました。通路を90度まわしながら走り続ける、終わりのないランゲームです。', en: "New game \"Corridor Dash\" is out. An endless running game where you keep running while rotating the corridor 90 degrees.", zh: "推出新作「迴廊快跑」。一邊把通道旋轉90度一邊不斷奔跑、沒有終點的跑酷遊戲。", ko: "신작 「회랑 질주」를 공개했어요. 통로를 90도씩 돌리며 계속 달리는 끝없는 러닝 게임이에요." },
  { date: '2026.10.05', text: '新作「盤滑（パンファ）」を公開しました。3手ごとに1列がすべる、リバーシの対戦ゲームです。', en: "New game \"Panfa — Sliding Reversi\" is out. A reversi battle game where one row slides every 3 moves.", zh: "推出新作「盤滑（Panfa）滑動黑白棋」。每3手就有1列滑動的黑白棋對戰遊戲。", ko: "신작 「판파 — 미끄러지는 리버시」를 공개했어요. 3수마다 한 줄이 미끄러지는 리버시 대전 게임이에요." },
  { date: '2026.10.02', text: '新作「さくがえ」を公開しました。柵の列を相手と入れかえる、6レーンのタワーディフェンスです。', en: "New game \"Fence Swap\" is out. A 6-lane tower defense where you swap fence rows with your opponent.", zh: "推出新作「柵欄互換」。和對手互換柵欄列的6路塔防。", ko: "신작 「울타리 체인지」를 공개했어요. 상대와 울타리 줄을 바꾸는 6레인 타워 디펜스예요." },
  { date: '2026.10.01', text: '新作「ハネタンク」を公開しました。はね返る弾で撃ち合う3Dの戦車バトルです。スマホとPCで対戦できます。', en: "New game \"Bounce Tank\" is out. A 3D tank battle where you shoot bouncing bullets. Play against each other on phone and PC.", zh: "推出新作「彈跳坦克」。用會反彈的子彈互射的3D坦克對戰。手機和電腦都能對戰。", ko: "신작 「튕김 탱크」를 공개했어요. 튕기는 탄으로 쏘아 대는 3D 탱크 배틀이에요. 스마트폰과 PC로 대전할 수 있어요." },
  { date: '2026.09.30', text: '新作「4つ目のダルマ」を公開しました。3ターンごとにだるま落としが起きる、4つ並べ対戦ゲームです。', en: "New game \"The 4th Daruma\" is out. A connect-four battle game where a daruma-otoshi knock-out happens every 3 turns.", zh: "推出新作「第四個達摩」。每3回合就會發生「打達摩」的四子棋對戰遊戲。", ko: "신작 「네 번째 달마」를 공개했어요. 3턴마다 달마 떨어뜨리기가 일어나는 사목 대전 게임이에요." },
  { date: '2026.09.30', text: 'ホームページ「なすびのお庭」をひらきました。', en: "Opened the homepage \"Nasubi's Garden\".", zh: "首頁「茄子的庭院」開張了。", ko: "홈페이지 「가지의 정원」을 열었어요." },
  { date: '2026.09.30', text: '「さかさまドロップ」を公開しました。合言葉でのオンライン対戦・観戦にも対応しています。', en: "\"Upside-Down Drop\" is out. It also supports online passcode matches and spectating.", zh: "推出「顛倒掉落」。也支援用暗號的線上對戰與觀戰。", ko: "「거꾸로 드롭」을 공개했어요. 암호로 하는 온라인 대전과 관전도 지원해요." }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
// ---------- ことば（日本語・English・繁體中文・한국어） ----------
const T = (k, v) => I18N.t(k, v);
const LG = () => I18N.lang;
// ゲームの文（名前・紹介・ひとこと）をいまの言葉で。訳がなければ日本語のまま
const loc = (g, f) => { const o = LG() !== 'ja' && g[LG()]; return o && o[f] != null ? o[f] : g[f]; };
const shortName = g => loc(g, 'short') || loc(g, 'name');
const tagText = t => { const k = 'tag:' + t, r = T(k); return r === k ? t : r; };
// ゲームへのリンクに ?lang=xx をつけて、ゲームも同じ言葉で始まるように（日本語のときはつけない）
const gameURL = g => LG() === 'ja' ? g.url : g.url + (g.url.includes('?') ? '&' : '?') + 'lang=' + LG();
const NEW = GAMES.find(g => g.badge && !g.soon);
let LIVE = {}, liveErr = false, sheetI = -1, newsOpen = false;
function render() {
  // 新作（いちばん新しい NEW のゲーム）を大きく
  if (NEW) {
    $('feature').innerHTML = `<div class="feature" data-gi="${GAMES.indexOf(NEW)}">
    <img src="${esc(NEW.image)}" alt="${esc(T('icon_alt', { n: loc(NEW, 'name') }))}">
    <div><span class="new">${esc(NEW.badge)}</span><h3>${esc(loc(NEW, 'name'))}</h3><p>${esc(loc(NEW, 'catch') || loc(NEW, 'text'))}</p>
      <div class="row"><a class="btn" href="${esc(gameURL(NEW))}">${esc(T('play'))}</a><button class="btn ghost" type="button">${esc(T('more'))}</button></div></div></div>`;
  } else $('new').hidden = true;
  // アイコン一覧
  $('game-list').innerHTML = GAMES.map((g, i) => g.soon
    ? `<div class="app soon"><span class="ic" aria-hidden="true">🌱</span><b>${esc(T('soon'))}</b></div>`
    : `<button class="app" type="button" data-gi="${i}"><span class="ic"><img src="${esc(g.image)}" alt="" loading="lazy">${g.badge ? '<i class="dot"></i>' : ''}</span><b>${esc(shortName(g))}</b></button>`).join('');
  // お知らせ：新しい3件、のこりは「もっと見る」
  $('news-list').innerHTML = NEWS.map((n, i) => `<li${i >= SHOW ? ' class="more"' : ''}><time>${esc(n.date)}</time><p>${esc((LG() !== 'ja' && n[LG()]) || n.text)}</p></li>`).join('');
  drawNewsBtn();
  drawLive();
  if (sheetI >= 0) fillSheet(sheetI);
}
// くわしく（下から出る）
let lastFocus = null;
function fillSheet(i) {
  const g = GAMES[i];
  $('sh-img').src = g.image; $('sh-img').alt = T('icon_alt', { n: loc(g, 'name') }); $('sh-name').textContent = loc(g, 'name'); $('sh-yomi').textContent = (LG() === 'ja' ? g.yomi : (g[LG()] || {}).yomi) || ''; // 日本語の読みがなは外国語では出さない
  $('sh-text').textContent = loc(g, 'text'); $('sh-tags').innerHTML = (g.tags || []).map(t => `<span>${esc(tagText(t))}</span>`).join(''); $('sh-play').href = gameURL(g);
  const lv = g.qm && LIVE[g.qm]; $('sh-live').textContent = g.qm ? (lv && (lv.wait || lv.pairs) ? T('sh_live', { w: lv.wait, p: lv.pairs }) : T('sh_can')) : '';
}
function openSheet(i) {
  const g = GAMES[i]; if (!g || g.soon) return;
  sheetI = i; fillSheet(i);
  lastFocus = document.activeElement; document.body.classList.add('sheet-on'); setTimeout(() => $('sh-play').focus({ preventScroll: true }), 50);
}
function closeSheet() { sheetI = -1; document.body.classList.remove('sheet-on'); if (lastFocus) lastFocus.focus({ preventScroll: true }); }
document.addEventListener('click', e => {
  if (e.target.closest('.feature a')) return;
  const el = e.target.closest('[data-gi]'); if (el) openSheet(+el.dataset.gi);
});
$('sheet-bg').onclick = closeSheet; $('sh-close').onclick = closeSheet;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
const SHOW = 3;
function drawNewsBtn() {
  if (NEWS.length <= SHOW) return;
  const b = $('news-more'); b.hidden = false; $('news-list').classList.toggle('open', newsOpen);
  b.textContent = newsOpen ? T('close') : T('news_more', { n: NEWS.length - SHOW });
}
$('news-more').onclick = () => { newsOpen = !newsOpen; drawNewsBtn(); };
document.getElementById('year').textContent = new Date().getFullYear();
// ---------- いまの人数（90秒ごとに見に行く。つながりっぱなしにしないので、同時接続の上限を使わない） ----------
// 地元の最強は別のデータベース（通信量を分けるため）
const DBURLS = ['https://sakasama-drop-default-rtdb.asia-southeast1.firebasedatabase.app', 'https://jimoto-saikyo-default-rtdb.asia-southeast1.firebasedatabase.app'];
const jstHour = () => new Date(Date.now() + 9 * 3600 * 1000).getUTCHours();
function drawLive() {
  const prime = jstHour() === 21, pe = $('prime');
  pe.textContent = T(prime ? 'qm_prime_hot' : 'qm_prime'); pe.classList.toggle('hot', prime);
  const qg = GAMES.filter(g => g.qm);
  let w = 0, p = 0; for (const g of qg) { const v = LIVE[g.qm]; if (v) { w += v.wait; p += v.pairs; } }
  if (liveErr) $('live-sum').textContent = T('live_err'); else $('live-sum').innerHTML = T('live_sum', { w, p });
  // 人がいるゲームを先に
  const order = qg.slice().sort((a, b) => ((LIVE[b.qm] || {}).wait || 0) - ((LIVE[a.qm] || {}).wait || 0));
  $('live-list').innerHTML = order.map(g => { const v = LIVE[g.qm] || { wait: 0, pairs: 0 }; return `<a href="${esc(gameURL(g))}" class="${v.wait ? 'on' : ''}"><img src="${esc(g.image)}" alt="">${esc(shortName(g))}<em>${esc(v.wait ? T('li_wait', { n: v.wait }) : v.pairs ? T('li_play', { n: v.pairs }) : '—')}</em></a>`; }).join('');
  document.querySelectorAll('#game-list .app[data-gi]').forEach(el => {
    const g = GAMES[+el.dataset.gi], v = g && g.qm && LIVE[g.qm], ic = el.querySelector('.ic'); let b = ic.querySelector('.wait');
    if (v && v.wait) { if (!b) { b = document.createElement('span'); b.className = 'wait'; ic.appendChild(b); } b.textContent = T('badge_wait', { n: v.wait }); } else if (b) b.remove();
  });
}
render();
document.addEventListener('langchange', render);
async function loadLive() {
  if (document.hidden) return;
  try {
    const all = await Promise.all(DBURLS.map(u => fetch(u + '/pres.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : undefined).catch(() => undefined)));
    if (all.every(x => x === undefined)) throw new Error('x');
    // 地元の最強は自分のデータベースの分だけ数える（古いデータベースに残った、もういない人の分を数えない）
    const v = Object.assign({}, ...all.map((x, i) => { const o = {}; for (const k in (x || {})) { const e = x[k]; if (i === 0 && e && e.g === 'jimoto') continue; o[k] = e; } return o; }));
    const out = {}; for (const k in v) { const e = v[k]; if (!e || !e.g) continue; const o = out[e.g] = out[e.g] || { wait: 0, play: 0 }; if (e.s === 'p') o.play++; else o.wait++; }
    for (const g in out) out[g].pairs = Math.ceil(out[g].play / 2);
    LIVE = out; liveErr = false; drawLive();
  } catch (e) { liveErr = true; drawLive(); }
}
drawLive(); loadLive(); setInterval(loadLive, 90000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadLive(); });
</script>
</body>
</html>
