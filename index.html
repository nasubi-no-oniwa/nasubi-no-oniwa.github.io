<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>なすびのお庭</title>
<meta name="description" content="なすびのお庭は、ブラウザですぐ遊べる小さなゲームをつくっている場所です。スマホでもPCでも、インストールなしで遊べます。">
<meta name="theme-color" content="#fbf6ec">
<meta property="og:title" content="なすびのお庭">
<meta property="og:description" content="ブラウザですぐ遊べる小さなゲームの庭。">
<meta property="og:type" content="website">
<link rel="icon" href="img/nasubi.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ec;
  --bg2: #f3ead8;
  --card: #ffffff;
  --ink: #3a2d4a;
  --muted: #7c6f86;
  --purple: #6b3fa0;
  --purple2: #8e5cc9;
  --leaf: #4f9a5a;
  --leaf2: #7cc47f;
  --soil: #b98b62;
  --line: rgba(58, 45, 74, 0.1);
  --shadow: 0 10px 30px rgba(74, 48, 104, 0.12);
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1626; --bg2: #241c31; --card: #2c2339; --ink: #f4eefb; --muted: #b8a9c9;
    --purple: #b58cf0; --purple2: #cfaefb; --leaf: #7cc47f; --leaf2: #a5e0a6; --soil: #d7ae86;
    --line: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #1c1626; --bg2: #241c31; --card: #2c2339; --ink: #f4eefb; --muted: #b8a9c9;
  --purple: #b58cf0; --purple2: #cfaefb; --leaf: #7cc47f; --leaf2: #a5e0a6; --soil: #d7ae86;
  --line: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  line-height: 1.7; -webkit-text-size-adjust: 100%;
}
a { color: inherit; }
.wrap { width: min(1040px, 100% - 32px); margin: 0 auto; }

/* ---------- ヘッダー ---------- */
header.top {
  position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 900; font-size: 18px; }
.brand svg { width: 34px; height: 34px; }
nav a { text-decoration: none; font-weight: 800; font-size: 14px; color: var(--muted); margin-left: 18px; }
nav a:hover { color: var(--purple); }

/* ---------- はじめ ---------- */
.hero { position: relative; overflow: hidden; padding: 56px 0 72px; }
.hero .wrap { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; align-items: center; }
.hero h1 { margin: 0; font-size: clamp(38px, 7vw, 64px); line-height: 1.15; font-weight: 900; letter-spacing: 0.02em; }
.hero h1 .n { color: var(--purple); }
.hero h1 .g { color: var(--leaf); }
.hero p { margin: 18px 0 28px; font-size: clamp(15px, 2.2vw, 17px); color: var(--muted); max-width: 30em; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 900; font-size: 16px;
  padding: 14px 24px; border-radius: 999px; color: #fff;
  background: linear-gradient(180deg, var(--purple2), var(--purple));
  box-shadow: 0 5px 0 color-mix(in srgb, var(--purple) 70%, black), 0 12px 24px rgba(107, 63, 160, 0.3);
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--purple) 70%, black); }
.mascot { width: min(320px, 100%); justify-self: center; animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
  background: radial-gradient(20px 12px at 20px 0, var(--leaf2) 98%, transparent) repeat-x;
  background-size: 40px 34px; opacity: .5;
}

/* ---------- 見出し ---------- */
section { padding: 56px 0; }
.sec-title { display: flex; align-items: baseline; gap: 12px; margin: 0 0 24px; }
.sec-title h2 { margin: 0; font-size: 26px; font-weight: 900; }
.sec-title span { font-size: 13px; color: var(--muted); font-weight: 800; letter-spacing: .12em; }

/* ---------- ゲーム一覧 ---------- */
#games { background: var(--bg2); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.game {
  background: var(--card); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden;
  display: flex; flex-direction: column; border: 1px solid var(--line);
  transition: transform .15s;
}
.game:hover { transform: translateY(-4px); }
.game .thumb {
  aspect-ratio: 16 / 10; display: grid; place-items: center; position: relative;
  background: linear-gradient(135deg, #2b1f66, #150f36);
}
.game .thumb img { width: 42%; aspect-ratio: 1; border-radius: 22%; box-shadow: 0 14px 30px rgba(0,0,0,.4); }
.game .badge {
  position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 900; padding: 4px 10px;
  border-radius: 999px; background: #ffe45e; color: #4a3700;
}
.game .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.game h3 { margin: 0; font-size: 20px; font-weight: 900; }
.game p { margin: 0; font-size: 14px; color: var(--muted); flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--bg2); color: var(--muted); }
.game .btn { align-self: flex-start; margin-top: 6px; padding: 11px 22px; font-size: 15px; }
.game.soon .thumb { background: repeating-linear-gradient(45deg, var(--bg2), var(--bg2) 12px, var(--bg) 12px, var(--bg) 24px); }
.game.soon .thumb .seed { font-size: 56px; }
.game.soon .btn { background: var(--bg2); color: var(--muted); box-shadow: none; pointer-events: none; }

/* ---------- お知らせ ---------- */
.news { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.news li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 16px 4px; border-bottom: 1px solid var(--line); }
.news time { font-size: 14px; font-weight: 800; color: var(--purple); font-variant-numeric: tabular-nums; }
.news p { margin: 0; font-size: 15px; }

/* ---------- このお庭について ---------- */
.about { display: grid; grid-template-columns: 120px 1fr; gap: 24px; align-items: center; background: var(--card); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.about svg { width: 120px; }
.about p { margin: 0 0 8px; }
.about p:last-child { margin: 0; color: var(--muted); font-size: 14px; }

footer { padding: 36px 0 48px; text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 720px) {
  .hero { padding: 32px 0 64px; }
  .hero .wrap { grid-template-columns: 1fr; text-align: center; }
  .hero p { margin-left: auto; margin-right: auto; }
  .mascot { width: 200px; grid-row: 1; }
  nav a { margin-left: 12px; font-size: 13px; }
  .news li { grid-template-columns: 1fr; gap: 2px; }
  .about { grid-template-columns: 1fr; text-align: center; }
  .about svg { margin: 0 auto; width: 96px; }
  section { padding: 44px 0; }
}
@media (max-width: 380px) { nav a:first-child { display: none; } }
@media (prefers-reduced-motion: reduce) { .mascot { animation: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>

<!-- なすびのキャラ（使い回し用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6ad6"/><stop offset=".55" stop-color="#6b3fa0"/><stop offset="1" stop-color="#43246a"/>
    </linearGradient>
    <symbol id="nasubi" viewBox="0 0 200 240">
      <ellipse cx="100" cy="228" rx="58" ry="8" fill="#000" opacity=".12"/>
      <path d="M100 58c46 0 70 44 70 96 0 44-30 74-70 74s-70-30-70-74c0-52 24-96 70-96z" fill="url(#nb)"/>
      <ellipse cx="70" cy="120" rx="12" ry="26" fill="#fff" opacity=".28" transform="rotate(18 70 120)"/>
      <path d="M100 30c-6 0-9 12-9 24" stroke="#3f7d46" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M52 76c14-26 34-30 48-22 14-8 34-4 48 22-14-4-26-2-34 6-4-8-10-10-14-10s-10 2-14 10c-8-8-20-10-34-6z" fill="#4f9a5a"/>
      <circle cx="80" cy="150" r="7" fill="#231432"/>
      <circle cx="120" cy="150" r="7" fill="#231432"/>
      <circle cx="82.5" cy="147.5" r="2.4" fill="#fff"/>
      <circle cx="122.5" cy="147.5" r="2.4" fill="#fff"/>
      <path d="M90 168q10 9 20 0" stroke="#231432" stroke-width="4" stroke-linecap="round" fill="none"/>
      <ellipse cx="66" cy="168" rx="9" ry="5" fill="#ff8fb1" opacity=".55"/>
      <ellipse cx="134" cy="168" rx="9" ry="5" fill="#ff8fb1" opacity=".55"/>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><svg aria-hidden="true"><use href="#nasubi"/></svg>なすびのお庭</a>
    <nav><a href="#games">ゲーム</a><a href="#news">お知らせ</a><a href="#about">このお庭</a></nav>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap">
      <div>
        <h1><span class="n">なすび</span>の<br><span class="g">お庭</span>へようこそ</h1>
        <p>ブラウザですぐ遊べる、小さなゲームを育てています。インストールなし、スマホでもPCでも、友だちと合言葉で対戦も。</p>
        <a class="btn" href="#games">ゲームであそぶ</a>
      </div>
      <svg class="mascot" viewBox="0 0 200 240" role="img" aria-label="なすびのキャラクター"><use href="#nasubi"/></svg>
    </div>
    <div class="ground" aria-hidden="true"></div>
  </div>

  <section id="games">
    <div class="wrap">
      <div class="sec-title"><h2>ゲーム</h2><span>GAMES</span></div>
      <div class="games" id="game-list"></div>
    </div>
  </section>

  <section id="news">
    <div class="wrap">
      <div class="sec-title"><h2>お知らせ</h2><span>NEWS</span></div>
      <ul class="news" id="news-list"></ul>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="about">
        <svg viewBox="0 0 200 240" aria-hidden="true"><use href="#nasubi"/></svg>
        <div>
          <p><b>なすびのお庭</b>は、思いついたゲームを1つずつ植えて育てている場所です。</p>
          <p>どのゲームも無料で、ブラウザを開くだけで遊べます。新しいゲームが実ったら、ここでお知らせします。</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>© <span id="year"></span> なすびのお庭</footer>

<script>
// =============================================
//  ゲームとお知らせの一覧
//  新しいゲームやお知らせは、ここに1つ足すだけで表示されます
// =============================================
const GAMES = [
  {
    name: 'さかさまドロップ',
    url: 'https://sakasama-drop.github.io/',
    image: 'img/sakasama-drop.png',
    text: '4つつなげて消す落ちものパズル。ゲージが溜まったら、相手の盤面をさかさまに！ 積み上げた連鎖がひっくり返る、荒れる対戦パズル。',
    tags: ['パズル', 'CPU対戦', '合言葉で対戦', '観戦'],
  },
  {
    name: '4つ目のダルマ',
    url: 'https://nasubi-no-oniwa.github.io/daruma/',
    image: 'img/daruma.png',
    text: '交互にダルマを落として、4つ並べたら勝ち。でも3ターンごとに、小槌が指した段がだるま落としで抜ける！ 並びが崩れるか、逆にそろうか。',
    tags: ['2人対戦', 'CPU対戦', 'この端末で2人', '合言葉で対戦', '観戦'],
  },
  {
    name: 'ハネタンク',
    url: 'https://nasubi-no-oniwa.github.io/hanetank/',
    image: 'img/hanetank.png',
    text: 'はね返る弾で撃ち合う、おもちゃの戦車バトル。毎戦スキルを振り直して、ブロックを仕込んで、2本先取！ 自分の弾にも当たるので要注意。',
    tags: ['3D', 'アクション', 'CPU対戦', '同じPCで2人', '合言葉で対戦', '観戦'],
  },
  {
    name: 'さくがえ',
    url: 'https://nasubi-no-oniwa.github.io/sakugae/',
    image: 'img/sakugae.png',
    text: '柵で道をつくって兵士を送りこむ、6レーンのタワーディフェンス。15秒ごとに、自分の柵の列と相手の柵の列をまるごと入れかえ！ 守りの迷路が、一瞬で相手のものに。',
    tags: ['タワーディフェンス', 'CPU対戦'],
    badge: 'NEW'
  },
  {
    name: 'つぎのゲーム',
    soon: true,
    text: 'ただいま土の中で育てています。芽が出るまでお待ちください。',
    tags: ['準備中']
  }
];

const NEWS = [
  { date: '2026.10.02', text: '新作「さくがえ」を公開しました。柵の列を相手と入れかえる、6レーンのタワーディフェンスです。' },
  { date: '2026.10.01', text: '新作「ハネタンク」を公開しました。はね返る弾で撃ち合う3Dの戦車バトルです。スマホとPCで対戦できます。' },
  { date: '2026.09.30', text: '新作「4つ目のダルマ」を公開しました。3ターンごとにだるま落としが起きる、4つ並べ対戦ゲームです。' },
  { date: '2026.09.30', text: 'ホームページ「なすびのお庭」をひらきました。' },
  { date: '2026.09.30', text: '「さかさまドロップ」を公開しました。合言葉でのオンライン対戦・観戦にも対応しています。' }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('game-list').innerHTML = GAMES.map(g => `
  <article class="game${g.soon ? ' soon' : ''}">
    <div class="thumb">
      ${g.badge ? `<span class="badge">${esc(g.badge)}</span>` : ''}
      ${g.soon ? '<span class="seed" aria-hidden="true">🌱</span>' : `<img src="${esc(g.image)}" alt="${esc(g.name)}のアイコン" loading="lazy">`}
    </div>
    <div class="body">
      <h3>${esc(g.name)}</h3>
      <p>${esc(g.text)}</p>
      <div class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      ${g.soon ? '<span class="btn">もうすぐ</span>' : `<a class="btn" href="${esc(g.url)}">あそぶ</a>`}
    </div>
  </article>`).join('');
document.getElementById('news-list').innerHTML = NEWS.map(n => `<li><time>${esc(n.date)}</time><p>${esc(n.text)}</p></li>`).join('');
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
